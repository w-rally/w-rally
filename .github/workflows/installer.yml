# On every push: build W-Rally (Release, x64, the runner's newest Visual Studio), run the tests that need no RBR folder, and build the MSI
# (installer/build-msi.ps1) - the run's artifact the .msi itself, "W-Rally-<version>-<commit>.msi", the version the project's (CMakeLists.txt).
# A pushed tag v<version> also makes a GitHub release of that MSI; the tag must name the project's version.
name: Installer

on:
  push:
  workflow_dispatch:

jobs:
  msi:
    runs-on: windows-2025
    permissions:
      contents: write                 # the release, on a tag
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Configure
        run: cmake -A x64 -S . -B build   # the newest Visual Studio on the runner

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests (those needing no RBR folder)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: MSI
        id: msi
        run: ./installer/build-msi.ps1 -Build build -Config Release

      - uses: actions/upload-artifact@v7
        with:
          path: build/${{ steps.msi.outputs.name }}.msi
          archive: false              # the .msi itself, named after the file (not a zip)
          if-no-files-found: error

      - name: Release (tag v<version>)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          MSI: build/${{ steps.msi.outputs.name }}.msi
        run: |
          $info = Get-Content build/generated/build_info.h -Raw
          if ($info -notmatch '#define WRALLY_VERSION "([^"]*)"') { throw "no WRALLY_VERSION in build_info.h" }
          if ("v$($Matches[1])" -ne $env:TAG) { throw "tag $env:TAG is not the project's version v$($Matches[1]) (CMakeLists.txt)" }
          gh release create $env:TAG $env:MSI --title "W-Rally $env:TAG" --generate-notes --verify-tag
