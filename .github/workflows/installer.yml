# On every push: build W-Rally (Release, x64, the runner's newest Visual Studio), run the tests that need no RBR folder, and build the MSI
# (installer/build-msi.ps1) - the run's artifact the .msi itself, "W-Rally-<version>-<commit>.msi", the version the project's (CMakeLists.txt).
name: Installer

on:
  push:
  workflow_dispatch:

jobs:
  msi:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Configure
        run: cmake -A x64 -S . -B build   # the newest Visual Studio on the runner

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests (those needing no RBR folder)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: MSI
        id: msi
        run: ./installer/build-msi.ps1 -Build build -Config Release

      - uses: actions/upload-artifact@v7
        with:
          path: build/${{ steps.msi.outputs.name }}.msi
          archive: false              # the .msi itself, named after the file (not a zip)
          if-no-files-found: error
