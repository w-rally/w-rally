# phys-drive's sound mix (audio/mix.h) - saved changes apply at once while driving.
#   name = volume [solo]      1 the level audio/audio.cpp sets; any "solo" layer plays alone with the other solo ones
# "engine" sets engine.on and engine.off together. phys-sim-check takes it as PHYS_SIM_MIX=<this file>.

master = 1

engine.on = 1          # the engine's loops on the throttle
engine.off = 1         # and off it
turbo = 1
valve = 1              # the blow-off valve
pops = 1               # on the overrun and at the limiter
bangs = 1              # a misfire off the throttle
gear = 1               # the gear change
dogring = 1
transmission = 1       # the gear whine
roll = 1               # the tyres rolling (the stage's surface)
skid = 1               # and sliding
wind = 1

# The engine's crossfades: the share of the way between two recorded revs (and between off and on the throttle) over
# which two loops play together, in its middle - 1 all the way, 0 a hard switch. Two loops at once can sound like two
# cars; narrower is one engine at a time. rpmBlend applies to the grains' two loops too.
engine.rpmBlend = 1
engine.loadBlend = 1

# The engine as grains, one per firing the physics reports (1), or as RBR's loops pitched to the revs (0).
engine.grains = 1
# The idle's wander (its firings drifting and swelling a few times a second, off the throttle below 3500 rpm): x this.
engine.idleWander = 1
